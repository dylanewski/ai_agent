<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Agent</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="chat-container">
        <h1>AI Agent</h1>

        <div id="messages"></div>

        <div id="image-preview" hidden>
            <div id="image-preview-thumb">
                <img id="image-preview-img" alt="">
                <div id="image-preview-spinner"></div>
            </div>
            <span id="image-preview-name"></span>
        </div>

        <div id="input-area">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button id="upload-button" type="button" title="Upload an image">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </button>
            <input type="text" id="user-input" placeholder="Type a message...">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
